# Persistent embedded graph stored on local disk.
# gremlin.graph: the factory class TinkerPop uses to create the graph (Titan's).
gremlin.graph=com.thinkaurelius.titan.core.TitanFactory
# storage.backend: where Titan keeps its data. berkeleyje = Oracle Berkeley DB Java Edition,
# an embedded key-value store (no separate server). Alternatives: cassandra, hbase, inmemory.
storage.backend=berkeleyje
# storage.directory: folder for the BerkeleyDB files.
# Titan resolves a relative path against THIS file's folder, so this is <project>/data/graph.
storage.directory=../data/graph
