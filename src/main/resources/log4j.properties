log4j.rootLogger=WARN, stderr
log4j.appender.stderr=org.apache.log4j.ConsoleAppender
log4j.appender.stderr.Target=System.err
log4j.appender.stderr.layout=org.apache.log4j.PatternLayout
log4j.appender.stderr.layout.ConversionPattern=%d{HH:mm:ss} %-5p %c{1} - %m%n
# Titan warns on every query that is not served by an index; too noisy for CLI output
log4j.logger.com.thinkaurelius.titan.graphdb.transaction.StandardTitanTx=ERROR
